<style>
/* Layout: one-column ledger. Balance slip on top, month-grouped rows, fixed capture bar at the bottom. Amounts in mono like a printed receipt. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F4F6F8;
  --ink:#18212B; --ink-2:#55616E; --line:#D8DEE5; --line-strong:#9AA6B2;
  --brand:#23406B; --on-brand:#FFFFFF; --brand-soft:#DCE6F4;
  --a:#0B6F6A; --a-soft:#D4EEEB;
  --b:#6E43AE; --b-soft:#E7DEF5;
  --open:#9A4A06; --open-soft:#FBE8CF;
  --done:#3F7A52; --done-soft:#DCEBE0; --on-done:#FFFFFF;
  --danger:#B42318;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-num:"DM Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10151B; --surface:#1A212A; --surface-2:#222B35;
    --ink:#E8EDF2; --ink-2:#A0ACB8; --line:#2E3945; --line-strong:#5C6977;
    --brand:#8DB3E8; --on-brand:#0E1620; --brand-soft:#23344D;
    --a:#52C7C0; --a-soft:#14393A;
    --b:#BC9AF2; --b-soft:#2D2346;
    --open:#F2B25C; --open-soft:#3A2A12;
    --done:#7FC291; --done-soft:#17301F; --on-done:#0E1620;
    --danger:#F28B82;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:560px;margin-inline:auto;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:150px}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:4px 14px}
.brand{font-weight:700;font-size:19px;letter-spacing:.04em}
.top-r{display:flex;gap:8px}
.pill{min-height:40px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px}

.chip{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font:700 11px/1 var(--f-body);font-style:normal;flex:none}
.chip.a{background:var(--a-soft);color:var(--a)}
.chip.b{background:var(--b-soft);color:var(--b)}

.note{background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px;padding:16px;color:var(--ink-2)}
.note .btn{margin-top:12px}

.bal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px}
.bal .lbl{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bal .big{font:500 40px/1.1 var(--f-num);letter-spacing:-.02em;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.bal .big.zero{color:var(--done)}
.bal .cnt{font-size:13px;color:var(--ink-2)}
.bal-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.confirm{margin-top:14px;padding:12px;border-radius:12px;background:var(--surface-2);font-size:13px}
.confirm .btn-row{margin-top:10px}

.btn{min-height:48px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);padding:0 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.wide{width:100%}
.btn.small{min-height:40px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 90px}

.filters{display:flex;gap:6px;margin:18px 0 4px;flex-wrap:wrap}
.fl{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500}
.fl[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:700}

.grp{margin-top:16px}
.grp h3{display:flex;justify-content:space-between;gap:10px;font-size:12px;letter-spacing:.06em;color:var(--ink-2);margin:0 2px 8px;font-weight:700}
.grp h3 span:last-child{font-family:var(--f-num);font-weight:400;letter-spacing:0}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto 44px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 2px 10px 12px;margin-bottom:8px;cursor:pointer}
.row .dt{font:500 14px/1.25 var(--f-num);text-align:center}
.row .dt small{display:block;font:400 11px/1.2 var(--f-body);color:var(--ink-2)}
.row .st{font-weight:700;overflow-wrap:anywhere;line-height:1.35}
.row .meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);margin-top:3px;flex-wrap:wrap}
.row .amt{text-align:right}
.row .amt b{display:block;font:500 16px/1.2 var(--f-num)}
.row .amt small{display:block;font-size:11px;color:var(--open);margin-top:2px;font-weight:700;white-space:nowrap}
.row.done .st{color:var(--ink-2)}
.row.done .amt small{color:var(--done)}
.chk{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;padding:0}
.chk span{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;color:transparent}
.chk[aria-pressed="true"] span{background:var(--done);border-color:var(--done);color:var(--on-done)}
.chk[disabled]{opacity:.5}
.empty{text-align:center;color:var(--ink-2);padding:28px 12px;background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px;margin-top:12px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.bar-in .btn{cursor:pointer}
.bar-in .primary{flex:1 1 auto}
.bar-in .btn:not(.primary){flex:0 0 96px}

.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,12,18,.55)}
.panel{width:100%;max-width:560px;max-height:calc(100dvh - env(safe-area-inset-top,0px) - 14px);overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding-top:16px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.sh-head h2{margin:0;font-size:18px;line-height:1.4;overflow-wrap:anywhere;text-wrap:balance}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;flex:none}
.sub{margin:0 0 12px;color:var(--ink-2);font-size:13px}
.panel p{margin:0 0 12px}
.field{display:grid;gap:6px;margin:0 0 14px;min-width:0}
.lbl{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.04em}
.field input[type=text],.field input[type=date],.field select,.amt-in{min-height:48px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);padding:0 12px;font-size:16px;width:100%;min-width:0}
.field input[type=text]:focus-visible,.field select:focus-visible{outline-offset:0}
.amt-in{display:flex;align-items:center;gap:6px;padding:0 12px}
.amt-in span{font:500 20px var(--f-num);color:var(--ink-2)}
.amt-in input{border:0;background:none;outline:0;min-width:0;width:100%;font:500 24px var(--f-num);padding:0;min-height:44px}
.amt-in:focus-within{outline:2px solid var(--brand)}
.claim{font-size:13px;color:var(--brand);background:var(--brand-soft);border-radius:10px;padding:9px 12px}
.err{color:var(--danger);font-size:13px;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{min-height:48px;border:1px solid var(--line-strong);border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;cursor:pointer;padding:0 8px;overflow-wrap:anywhere}
.seg input:checked+label{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.seg input:focus-visible+label{outline:2px solid var(--brand);outline-offset:2px}

.scan{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:12px;padding:12px;margin-bottom:14px}
.scan .th{width:64px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none}
.scan .tx{min-width:0;flex:1;font-size:13px}
.scan .tx b{display:block;font-size:14px;margin-bottom:2px}
.scan .btn{margin-top:8px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line-strong);border-top-color:var(--brand);border-radius:50%;vertical-align:-2px;margin-right:6px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}

.rimg{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);margin-bottom:14px;color:var(--ink-2);font-size:13px;padding:10px}
.rimg img{display:block;width:100%;height:auto;border-radius:6px}
.d-amt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.d-amt b{font:500 30px/1.2 var(--f-num)}
.d-amt span{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.d-claim{display:flex;justify-content:space-between;gap:10px;background:var(--open-soft);color:var(--open);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:700;font-size:14px}
.d-claim.done{background:var(--done-soft);color:var(--done)}
.items{margin-bottom:12px;font-size:13px}
.items summary{cursor:pointer;color:var(--ink-2);min-height:32px}
.items ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.items li{display:flex;justify-content:space-between;gap:10px}
.items li span:first-child{min-width:0;overflow-wrap:anywhere}
.memo{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px;overflow-wrap:anywhere}
.tbl{overflow-x:auto;margin-top:8px}
.tbl table{border-collapse:collapse;width:100%;min-width:430px;font-size:13px}
.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:11px;color:var(--ink-2);letter-spacing:.04em}
.tbl td{font-family:var(--f-num)}
.tbl td:first-child{font-family:var(--f-body)}
.tbl tfoot td{font-weight:700;border-bottom:0}
.hint{font-size:12px;color:var(--ink-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:80;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;text-align:center}

.wiz{margin-bottom:14px}
.wiz h2{margin:0 0 6px;font-size:17px}
.wiz p{margin:0 0 10px;font-size:14px}
.steps{margin:16px 0 0;padding:0;list-style:none;counter-reset:s;display:grid;gap:18px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;font-size:14px}
.steps li::before{content:counter(s);grid-row:1/3;width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font:700 13px var(--f-num)}
.steps li>b{grid-column:2;line-height:1.4}
.steps li>div{grid-column:2;color:var(--ink-2);min-width:0}
pre.code{margin:8px 0;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;font:12px/1.5 var(--f-num);overflow-x:auto;white-space:pre;color:var(--ink)}
textarea.in{display:block;width:100%;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:10px 12px;font:13px/1.5 var(--f-num);margin:8px 0;resize:vertical}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">ふたりの立替帳</div>
    <div class="top-r" id="topR">
      <button class="pill" data-action="monthly" type="button">月別</button>
      <button class="pill" data-action="settings" id="meBtn" type="button">設定</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <label class="btn primary" for="photo" id="photoBtn" tabindex="0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      レシートを読み取る
    </label>
    <button class="btn" data-action="manual" type="button">手入力</button>
  </div>
</div>
<input type="file" id="photo" accept="image/*" class="vh" tabindex="-1">

<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(()=>{
'use strict';
const CATS=['食事','買い物','日用品','交通','娯楽','その他'];
const WD=['日','月','火','水','木','金','土'];
const FB='https://www.gstatic.com/firebasejs/10.14.1/';
const TESS='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /rooms/{room}/{coll}/{id} {
      allow read, write: if coll in ['settings','expenses','receipts'];
    }
  }
}`;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
const half=n=>Math.ceil(n/2);
const pad=n=>String(n).padStart(2,'0');
const isDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const md=s=>{if(!isDate(s))return '';const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()};
const mdw=s=>{if(!isDate(s))return '';const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'};
const other=p=>p==='a'?'b':'a';
const num=s=>{s=String(s||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[^\d]/g,'');return s?parseInt(s,10):NaN};
const ICON={
  x:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  ck:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};
const LS={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};

const S={cfg:null,room:null,names:null,expenses:[],me:null,gotS:false,gotE:false,srvS:false,ready:false,fail:null,slow:false,
  filter:'open',confirmAll:false,pending:new Set(),sheet:null,form:null,rc:{},delArm:null,resetArm:false,timer:null};
let FS=null;

const nm=s=>(S.names&&S.names[s])||(s==='a'?'自分':'相手');
const ini=s=>[...nm(s)][0]||'?';
const chip=s=>`<i class="chip ${s}">${esc(ini(s))}</i>`;

function norm(id,d){
  const amount=Math.round(Number(d.amount));
  return {id,payer:d.payer==='b'?'b':'a',amount:Number.isFinite(amount)&&amount>0?amount:0,
    date:isDate(d.date)?d.date:todayStr(),time:typeof d.time==='string'?d.time:'',
    store:typeof d.store==='string'?d.store:'',category:typeof d.category==='string'?d.category:'',
    memo:typeof d.memo==='string'?d.memo:'',items:Array.isArray(d.items)?d.items.slice(0,20):[],
    settled:d.settled===true,settledAt:isDate(d.settledAt)?d.settledAt:null,settledBy:d.settledBy==='a'||d.settledBy==='b'?d.settledBy:null,
    createdAt:typeof d.createdAt==='string'?d.createdAt:'',hasReceipt:d.hasReceipt===true};
}
const sorted=()=>[...S.expenses].sort((a,b)=>b.date.localeCompare(a.date)||b.time.localeCompare(a.time)||b.createdAt.localeCompare(a.createdAt));
function totals(list){
  let aTo=0,bTo=0;
  for(const e of list){ if(e.payer==='a')aTo+=half(e.amount); else bTo+=half(e.amount) }
  const net=aTo-bTo; // >0: b owes a
  return {net,deb:net>0?'b':'a',cred:net>0?'a':'b'};
}

/* ---------- connection (Firebase config + room) ---------- */
const b64e=o=>btoa(JSON.stringify(o)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>JSON.parse(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)));
const okRoom=r=>typeof r==='string'&&/^[a-z0-9]{12,40}$/.test(r);
const okCfg=c=>!!c&&typeof c==='object'&&['k','p','a'].every(x=>typeof c[x]==='string'&&c[x].length>3&&c[x].length<200);
function fromLink(t){
  t=String(t||'').trim();
  const i=t.indexOf('#');
  const q=new URLSearchParams(i>=0?t.slice(i+1):t);
  let cfg=null;
  try{const c=q.get('c');if(c)cfg=b64d(c)}catch(e){}
  const room=q.get('r');
  return {cfg:okCfg(cfg)?cfg:null,room:okRoom(room)?room:null};
}
function parseCfg(t){
  const g={};const re=/(apiKey|authDomain|projectId|appId)["']?\s*:\s*["']([^"']+)["']/g;let m;
  while((m=re.exec(String(t||''))))g[m[1]]=m[2];
  if(!g.apiKey||!g.projectId||!g.appId)return null;
  return {k:g.apiKey,p:g.projectId,a:g.appId,d:g.authDomain||g.projectId+'.firebaseapp.com'};
}
const newRoom=()=>{const a=new Uint8Array(20);crypto.getRandomValues(a);return [...a].map(x=>'abcdefghijklmnopqrstuvwxyz0123456789'[x%36]).join('')};
const shareLink=()=>location.origin+location.pathname+'#c='+b64e(S.cfg)+'&r='+S.room;
function saveConn(){LS.set('tatekae.cfg',JSON.stringify(S.cfg));LS.set('tatekae.room',S.room);try{history.replaceState(null,'','#c='+b64e(S.cfg)+'&r='+S.room)}catch(e){}}
function loadConn(){
  const h=fromLink(location.hash);
  if(h.cfg&&h.room){S.cfg=h.cfg;S.room=h.room;LS.set('tatekae.cfg',JSON.stringify(h.cfg));LS.set('tatekae.room',h.room);return}
  try{const c=JSON.parse(LS.get('tatekae.cfg')||'null');if(okCfg(c))S.cfg=c}catch(e){}
  const r=LS.get('tatekae.room');if(okRoom(r))S.room=r;
}
const R=(coll,id)=>FS.m.doc(FS.db,'rooms',S.room,coll,id);
const C=coll=>FS.m.collection(FS.db,'rooms',S.room,coll);
const wr=p=>Promise.race([p,new Promise(res=>setTimeout(()=>res('timeout'),7000))]);

/* ---------- toast / sheet ---------- */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}
function openSheet(type,html,extra){
  S.sheet=Object.assign({type},extra||{});
  $('#panel').innerHTML=html;
  $('#sheet').hidden=false;document.body.classList.add('lock');
  $('#panel').scrollTop=0;
}
function closeSheet(){
  if(S.form&&S.form.stop)S.form.stop();
  S.form=null;S.sheet=null;S.delArm=null;S.resetArm=false;
  $('#sheet').hidden=true;document.body.classList.remove('lock');$('#panel').innerHTML='';
}
function refreshSheet(){
  const sh=S.sheet;if(!sh)return;
  if(sh.type==='detail'){const e=S.expenses.find(x=>x.id===sh.id);if(!e){closeSheet();return}renderDetail(e)}
  else if(sh.type==='monthly'){$('#panel').innerHTML=monthlyHtml()}
}
function writeFail(e){
  const c=e&&e.code;
  if(c==='permission-denied')toast('保存できません。Firebaseのルールを確認してください');
  else if(c==='resource-exhausted')toast('無料の利用上限に達しました。明日もう一度お試しください');
  else toast('保存できませんでした。通信を確認してもう一度お試しください');
}
async function copyText(text,el){
  try{await navigator.clipboard.writeText(text);toast('コピーしました');return}catch(e){}
  if(el){el.focus();el.select&&el.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}toast(ok?'コピーしました':'文字を選択しました。長押しでコピーしてください')}
}

/* ---------- identity ---------- */
function loadMe(){const m=LS.get('tatekae.me');return m==='a'||m==='b'?m:null}
function saveMe(slot){S.me=slot;LS.set('tatekae.me',slot);renderMain();maybeOnboard()}

/* ---------- wizard (first run) ---------- */
function wizardHtml(){
  return `<section class="bal wiz">
    <h2>はじめての設定</h2>
    <p>最初の1人だけ、10分ほどかかります。パソコンで作業するのがおすすめです。もう1人は、あなたが渡すリンクを開くだけです。</p>
    <ol class="steps">
      <li><b>Firebaseでプロジェクトを作る</b><div><a href="https://console.firebase.google.com/" target="_blank" rel="noopener">Firebaseコンソール</a>をGoogleアカウントで開き、「プロジェクトを追加」。名前は何でもよく、Googleアナリティクスはオフで作成します。</div></li>
      <li><b>データベースを作る</b><div>左メニューの「構築」から「Firestore Database」を選び、「データベースを作成」。場所は「asia-northeast1(東京)」、モードは「本番環境モード」にします。</div></li>
      <li><b>ルールを貼り付ける</b><div>Firestoreの「ルール」タブの中身をすべて消して、下のルールを貼り付け、「公開」を押します。<pre class="code" id="rules">${esc(RULES)}</pre><button class="btn small" data-action="copy-rules" type="button">ルールをコピー</button></div></li>
      <li><b>接続の情報をコピーする</b><div>左上の歯車から「プロジェクトの設定」→「全般」→「マイアプリ」で、ウェブ(「&lt;/&gt;」)を選んで登録します。表示される firebaseConfig の { } の部分をコピーします。</div></li>
      <li><b>ここに貼り付ける</b><div><textarea class="in" id="cfg-in" rows="6" placeholder="const firebaseConfig = {&#10;  apiKey: &quot;...&quot;,&#10;  ...&#10;};" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea><p class="err" id="cfg-err" role="alert" hidden></p><button class="btn primary wide" data-action="connect" type="button">接続する</button></div></li>
    </ol>
  </section>
  <section class="bal wiz">
    <h2>リンクを受け取った人</h2>
    <p>相手から届いたリンクを開けば、そのまま使えます。開けないときは、リンクをここに貼り付けてください。</p>
    <div class="field"><label class="lbl" for="join-in">共有リンク</label><input type="text" id="join-in" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <p class="err" id="join-err" role="alert" hidden></p>
    <button class="btn wide" data-action="join" type="button">参加する</button>
  </section>`;
}

/* ---------- main render ---------- */
function balanceHtml(){
  const open=S.expenses.filter(e=>!e.settled);
  const t=totals(open);
  if(!open.length){
    return `<section class="bal"><div class="lbl">いまの貸し借り</div><div class="big zero mono">¥0</div><div class="cnt">未返済はありません。すべて精算済みです。</div></section>`;
  }
  let label;
  if(t.net===0)label='未返済は互いに相殺されています';
  else if(S.me===t.deb)label=`あなたが ${chip(t.cred)}${esc(nm(t.cred))}さんへ返す金額`;
  else if(S.me===t.cred)label=`${chip(t.deb)}${esc(nm(t.deb))}さんから受け取る金額`;

/* ---------- receipt text parsing ---------- */
/* PARSE-START */
const zen=s=>s.replace(/[０-９Ａ-Ｚａ-ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/，/g,',').replace(/．/g,'.').replace(/￥/g,'¥');
function cleanOcr(t){
  t=zen(String(t||'').replace(/\r/g,''));
  const cjk='[\\u3040-\\u30ff\\u3400-\\u9fff]';
  const re=new RegExp('('+cjk+')[ \\t\\u3000]+(?='+cjk+')','g');
  return t.replace(re,'$1');
}
function amountsIn(line){
  const out=[];const re=/(?:[¥\\]|Y)?\s*(\d{1,3}(?:[,.]\d{3})+|\d+)(?:\s*円)?(\s*[点個枚本袋])?/g;let m;
  while((m=re.exec(line))){
    if(m[2])continue;
    const v=parseInt(m[1].replace(/[,.]/g,''),10);
    if(v>0&&v<10000000)out.push(v);
  }
  return out;
}
function pickTotal(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const KEY=[[/総合計|合計|お買上|お買い上|ご請求|請求額|ご利用額|お会計|TOTAL/i,3],[/税込/,2],[/お?支払|現金|クレジット|カード/,1]];
  const skip=l=>/預|釣|おつり|お返し|返金/.test(l)||(/小計|消費税|内税|外税|対象|割引|値引|ポイント|点数|クーポン/.test(l)&&!/税込合計|総合計/.test(l));
  let best=null;
  for(let i=0;i<lines.length;i++){
    const l=lines[i];
    if(skip(l))continue;
    let pri=0;for(const [re,p] of KEY){if(re.test(l))pri=Math.max(pri,p)}
    if(!pri)continue;
    let a=amountsIn(l);
    if(!a.length&&lines[i+1]&&!skip(lines[i+1]))a=amountsIn(lines[i+1]);
    if(!a.length)continue;
    const v=a[a.length-1];
    if(!best||pri>best.pri||(pri===best.pri&&v>best.v))best={pri,v};
  }
  if(best)return best.v;
  let mx=null;
  for(const l of lines){
    if(skip(l)||!/[¥円]/.test(l))continue;
    for(const v of amountsIn(l))if(mx===null||v>mx)mx=v;
  }
  return mx;
}
function pickDate(text){
  const now=new Date();const lo=new Date(2015,0,1);const hi=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  const cand=[];let m;
  const r1=/(20\d{2})\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})/g;
  while((m=r1.exec(text)))cand.push([+m[1],+m[2],+m[3]]);
  const r2=/(?:令和|R)\s*(\d{1,2})\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})/g;
  while((m=r2.exec(text)))cand.push([2018+(+m[1]),+m[2],+m[3]]);
  const r3=/(?:^|[^\d])(\d{2})[\/\-.](\d{1,2})[\/\-.](\d{1,2})(?!\d)/gm;
  while((m=r3.exec(text)))cand.push([2000+(+m[1]),+m[2],+m[3]]);
  for(const [y,mo,d] of cand){
    if(mo<1||mo>12||d<1||d>31)continue;
    const dt=new Date(y,mo-1,d);
    if(dt.getMonth()!==mo-1||dt<lo||dt>hi)continue;
    return y+'-'+pad(mo)+'-'+pad(d);
  }
  return null;
}
function pickStore(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean).slice(0,8);
  const word='A-Za-z0-9\\u3040-\\u30ff\\u3400-\\u9fff';
  const trim=new RegExp('^[^'+word+']+|[^'+word+')）]+$','g');
  for(const l of lines){
    if(/電話|TEL|Tel|領収|レシート|〒|\d{3}-\d{4}|https?:|www\.|登録番号|^T\d{10}|\d{4}[\/\-.年]|^[\d\s\-:¥,.]+$/.test(l))continue;
    const s=l.replace(trim,'').trim();
    if(s.length>=2&&/[A-Za-z぀-ヿ㐀-鿿]{2}/.test(s))return s.slice(0,30);
  }

function guessCat(text,store){

  if(/レストラン|カフェ|珈琲|コーヒー|COFFEE|CAFE|ラーメン|居酒屋|寿司|すし|焼肉|食堂|ダイニング|マクドナルド|スターバックス|ドトール|牛丼|うどん|そば|定食|ベーカリー|弁当|ピザ/i.test(t))return '食事';
  if(/ドラッグ|薬局|ダイソー|ホームセンター|ニトリ|スーパー|マート|ストア|ローソン|セブン|ファミリーマート|ミニストップ|イオン|コンビニ/.test(t))return '日用品';

function loadImg(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const im=new Image();
    im.onload=()=>res({im,url});im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('decode'))};im.src=url;
  });
}
function canvasOf(im,max){
  const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return c;
}
function prepCanvas(c){
  const x=c.getContext('2d');const d=x.getImageData(0,0,c.width,c.height);const p=d.data;
  const hist=new Uint32Array(256);
  for(let i=0;i<p.length;i+=4){const g=((p[i]*299+p[i+1]*587+p[i+2]*114)/1000)|0;p[i]=p[i+1]=p[i+2]=g;hist[g]++}
  const n=p.length/4;let lo=0,hi=255,acc=0;
  for(let v=0;v<256;v++){acc+=hist[v];if(acc>n*0.01){lo=v;break}}
  acc=0;for(let v=255;v>=0;v--){acc+=hist[v];if(acc>n*0.01){hi=v;break}}
  if(hi-lo>30){const k=255/(hi-lo);for(let i=0;i<p.length;i+=4){const v=Math.max(0,Math.min(255,(p[i]-lo)*k));p[i]=p[i+1]=p[i+2]=v}}
  x.putImageData(d,0,0);
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script'));document.head.appendChild(s)})}
/* ---------- AI reading (Gemini, key kept on this device) ---------- */
const GMODELS=['gemini-flash-latest'];
function aiPrompt(){
  return `添付の画像は日本のレシートまたは領収書です。内容を読み取り、次の形式のJSONだけを返してください。
{"isReceipt":true,"store":"店名","date":"YYYY-MM-DD","total":0,"category":"食事","items":[{"name":"品名","price":0}]}
ルール:
- total は客が実際に支払った税込の合計金額(整数・円)。お預り金額、お釣り、小計、ポイント利用前の金額は使わない。合計が複数あるときは最終的な支払総額を選ぶ。
- date は西暦に直す(令和N年は2018+N年、「26/11/08」は2026-11-08)。今日は${todayStr()}。
- category は 食事 / 買い物 / 日用品 / 交通 / 娯楽 / その他 のどれか1つ。
- items は読み取れた商品を最大15件。自信のないものは入れない。
- 読み取れない項目は null にする。数字を推測で作らない。
- 画像がレシートでなければ isReceipt を false にする。`;
}
function normAi(o){
  if(!o||typeof o!=='object'||o.isReceipt===false)throw {code:'notreceipt'};
  const total=Math.round(Number(String(o.total==null?'':o.total).replace(/[^\d.]/g,'')));
  let date=isDate(o.date)?o.date:null;
  if(date){const d=pd(date);if(d<new Date(2015,0,1)||d>new Date(Date.now()+864e5))date=null}
  const items=(Array.isArray(o.items)?o.items:[]).filter(i=>i&&i.name).slice(0,15).map(i=>{const pr=Math.round(Number(i.price));return {name:String(i.name).slice(0,40),price:Number.isFinite(pr)?pr:null}});
  return {store:typeof o.store==='string'?o.store.trim().slice(0,60):'',date,total:Number.isFinite(total)&&total>0?total:null,category:CATS.includes(o.category)?o.category:'',items};
}
const gUrl=(m,k,mode)=>'https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent'+(mode==='q'?'?key='+encodeURIComponent(k):'');
const gHdr=(mode,k)=>mode==='q'?{'Content-Type':'application/json'}:{'Content-Type':'application/json','x-goog-api-key':k};
async function errMsgOf(res){try{const j=await res.json();return (j&&j.error&&j.error.message)||''}catch(e){return ''}}
async function pickModels(key,signal){
  try{
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key='+encodeURIComponent(key),{signal});
    if(!r.ok)return [];
    const j=await r.json();
    const list=(j.models||[]).filter(m=>m&&typeof m.name==='string'&&(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,''));
    const ok=list.filter(n=>/^gemini-/.test(n)&&/flash/.test(n)&&!/lite|image|tts|live|audio|embed|robot|computer|exp|native|thinking|preview/.test(n));
    const ver=n=>{const m=n.match(/gemini-(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0};
    ok.sort((a,b)=>ver(b)-ver(a));
    const out=[];
    if(list.includes('gemini-flash-latest'))out.push('gemini-flash-latest');
    for(const n of ok)if(!out.includes(n))out.push(n);
    return out.slice(0,4);
  }catch(e){if(signal&&signal.aborted)throw e;return []}
}
async function callModels(key,cands,body,signal){
  let busy=null;
  for(const m of cands){
    let res=null;
    for(const mode of ['h','q']){
      try{res=await fetch(gUrl(m,key,mode),{method:'POST',headers:gHdr(mode,key),body,signal})}
      catch(e){if(signal.aborted)throw e;res=null;continue}
      if(res.ok||res.status===404||res.status===429||res.status>=500)break;
    }
    if(!res)throw {code:'net'};
    if(res.status===404)continue;
    if(res.status>=500){busy={code:'busy',detail:String(res.status)};continue}
    if(!res.ok){
      const msg=await errMsgOf(res);
      throw {code:res.status===429?'limit':(res.status===400||res.status===401||res.status===403)?'key':'http',detail:res.status+(msg?' '+msg.slice(0,90):'')};
    }
    let j;try{j=await res.json()}catch(e){throw {code:'json'}}
    const parts=j&&j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts;
    const t=Array.isArray(parts)?parts.map(p=>p.text||'').join(''):'';
    if(!t)throw {code:'empty'};
    let o;try{o=JSON.parse(t.replace(/^\s*```(?:json)?\s*|\s*```\s*$/g,''))}catch(e){throw {code:'json'}}
    const r=normAi(o);
    LS.set('tatekae.gm',m);
    return r;
  }
  if(busy)throw busy;
  throw {code:'model',detail:'使えるモデルがありません'};
}
const sleep=(ms,signal)=>new Promise((res,rej)=>{const t=setTimeout(res,ms);if(signal)signal.addEventListener('abort',()=>{clearTimeout(t);rej({name:'AbortError'})},{once:true})});
async function readWithAI(key,dataUrl,signal){
  const b64=dataUrl.split(',')[1];
  const body=JSON.stringify({contents:[{parts:[{text:aiPrompt()},{inline_data:{mime_type:'image/jpeg',data:b64}}]}],generationConfig:{responseMimeType:'application/json',temperature:0}});
  const cached=LS.get('tatekae.gm');
  if(cached){
    try{return await callModels(key,[cached],body,signal)}
    catch(e){if(!(e&&(e.code==='model'||e.code==='busy')))throw e;if(e.code==='model')LS.del('tatekae.gm')}
  }
  let cands=await pickModels(key,signal);
  if(!cands.length)cands=GMODELS.slice();
  try{return await callModels(key,cands,body,signal)}
  catch(e){
    if(!(e&&e.code==='busy'))throw e;
    await sleep(2500,signal);
    return await callModels(key,cands,body,signal);
  }
}
function aiErrMsg(e){
  const c=e&&e.code;
  const why=c==='key'?'AIのキーが正しくないか、使えない状態です。設定で確認してください。'
    :c==='limit'?'AIの無料の利用上限に達しました。しばらくしてからお試しください。'
    :c==='net'?'AIに接続できませんでした。設定の「接続をテスト」で原因を確認できます。'
    :c==='busy'?'AIが混み合っています。少し待ってから、もう一度お試しください。'
    :c==='model'?'使えるAIモデルが見つかりませんでした。'
    :c==='notreceipt'?'AIがレシートとして読み取れませんでした。'
    :'AIでうまく読み取れませんでした。';
  return why+(e&&e.detail?'('+e.detail+')':'')+' 簡易の読み取りに切り替えました。';
}
async function testKey(){
  const k=LS.get('tatekae.gk');const out=$('#g-test');if(!out)return;
  out.hidden=false;
  if(!k){out.textContent='先にキーを保存してください。';return}
  out.textContent='確認中…';
  const lines=[];
  const cands=await pickModels(k);
  lines.push('使えるモデル: '+(cands.join(', ')||'取得できませんでした'));
  for(const m of (cands.length?cands:['gemini-flash-latest']).slice(0,4)){
    let ok=false;
    for(const mode of ['h','q']){
      try{
        const r=await fetch(gUrl(m,k,mode),{method:'POST',headers:gHdr(mode,k),body:JSON.stringify({contents:[{parts:[{text:'okと返してください'}]}]})});
        let msg='';try{const j=await r.json();msg=(j&&j.error&&j.error.message)||(j&&j.candidates?'応答あり':'')}catch(e){}
        lines.push(m+': '+r.status+' '+msg.slice(0,60));
        ok=r.ok;break;
      }catch(e){if(mode==='q')lines.push(m+': 接続できません')}
    }
    if(ok)break;

  out.textContent=lines.join('\n');
}
function saveKey(){
  const v=($('#g-key').value||'').trim();
  if(v&&!/^[A-Za-z0-9_.\-]{20,200}$/.test(v)){toast('キーの形式が違います。コピーし直してください');return}

async function runScan(file){
  const F=S.form;if(!F)return;
  if(F.stop)F.stop();
  const tok=++F.token;
  const live=()=>S.form===F&&tok===F.token;
  let worker=null,stopped=false;
  F.stop=()=>{stopped=true;if(worker){try{worker.terminate()}catch(e){}worker=null}};
  F.aiNote='';
  setScan('reading','写真を準備中…');
  let loaded;
  try{loaded=await loadImg(file)}catch(e){if(live())setScan('error','この写真を開けませんでした。別の写真を選ぶか、手入力してください。');return}
  let canvas;
  try{
    F.thumb=canvasOf(loaded.im,900).toDataURL('image/jpeg',0.6);
    canvas=canvasOf(loaded.im,1600);F.jpeg=canvas.toDataURL('image/jpeg',0.85);prepCanvas(canvas);
  }catch(e){URL.revokeObjectURL(loaded.url);if(live())setScan('error','この写真を処理できませんでした。別の写真を選ぶか、手入力してください。');return}
  URL.revokeObjectURL(loaded.url);
  if(!live())return;
  const gk=LS.get('tatekae.gk');
  if(gk&&F.jpeg){
    setScan('reading','AIで読み取り中…');
    const ctl=new AbortController();
    F.stop=()=>{stopped=true;ctl.abort();if(worker){try{worker.terminate()}catch(e){}worker=null}};
    try{
      const r=await readWithAI(gk,F.jpeg,ctl.signal);
      if(!live()||stopped)return;
      applyScan(F,r);return;
    }catch(e){
      if(!live())return;
      if(stopped||(e&&e.name==='AbortError')){setScan('manual','読み取りを中止しました。金額などを入力してください。');return}
      F.aiNote=aiErrMsg(e);
    }
  }
  setScan('reading','読み取りの準備中…(初回はデータの読み込みに数分かかることがあります)');
  try{
    if(!window.Tesseract)await loadScript(TESS);
    if(!live()||stopped)return;
    worker=await window.Tesseract.createWorker('jpn+eng',1,{logger:m=>{
      if(!live()||!m)return;
      if(m.status==='recognizing text')setScan('reading','読み取り中…',Math.round((m.progress||0)*100));
      else if(/load|init/.test(m.status||''))setScan('reading','読み取りの準備中…(初回はデータの読み込みに数分かかることがあります)');
    }});
    if(!live()||stopped){try{worker.terminate()}catch(e){}return}
    const r=await worker.recognize(canvas);
    try{await worker.terminate()}catch(e){}
    worker=null;
    if(!live()||stopped)return;
    applyScan(F,parseReceipt(r&&r.data&&r.data.text||''));
  }catch(e){
    if(!live())return;
    if(stopped){setScan('manual','読み取りを中止しました。金額などを入力してください。');return}
    setScan('error','通信を確認してもう一度試すか、手入力してください。');
  }
}
function applyScan(F,r){
  const put=(id,v)=>{const el=$('#'+id);if(el&&v!==''&&v!=null&&!F.dirty.has(id))el.value=v};
  if(r.total>0)put('f-amount',String(r.total));
  if(r.store)put('f-store',r.store);
  if(r.date)put('f-date',r.date);
  if(CATS.includes(r.category))put('f-cat',r.category);
  F.items=Array.isArray(r.items)?r.items:[];
  updateClaim();
  const miss=[];if(!(r.total>0))miss.push('金額');if(!r.date)miss.push('日付');
  setScan('done',(F.aiNote?F.aiNote+' ':'')+(miss.length?`${miss.join('・')}は読み取れませんでした。入力してください。`:'金額と日付を確かめてから記録してください。'));
}

  const id=t.dataset.id;const act=t.dataset.action;
  const ex=id?S.expenses.find(e=>e.id===id):null;
  switch(act){
    case 'close':closeSheet();break;
    case 'filter':S.filter=t.dataset.f;renderMain();break;
    case 'open':if(ex)renderDetail(ex);break;

    case 'settle-ask':S.confirmAll=true;renderMain();break;

      else{S.delArm=id;renderDetail(ex);setTimeout(()=>{if(S.delArm===id){S.delArm=null;const e2=S.expenses.find(x=>x.id===id);if(e2&&S.sheet&&S.sheet.type==='detail'&&S.sheet.id===id)renderDetail(e2)}},4000)}

    case 'join':join();break;
    case 'copy-rules':copyText(RULES,null);break;
    case 'copy-link':copyText(shareLink(),$('#share-link'));break;
    case 'save-key':saveKey();break;
    case 'test-key':testKey();break;
    case 'reset-conn':resetConn();break;
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&S.sheet&&S.sheet.type!=='onboard'){closeSheet();return}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('.row')){ev.preventDefault();ev.target.click()}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.id==='photoBtn'){ev.preventDefault();$('#photo').click()}
});
$('#panel').addEventListener('input',ev=>{
  if(S.form&&ev.target.id)S.form.dirty.add(ev.target.id);
  if(S.form)updateClaim();
});
$('#panel').addEventListener('change',()=>{if(S.form)updateClaim()});
$('#photo').addEventListener('change',ev=>{
  const f=ev.target.files&&ev.target.files[0];ev.target.value='';
  if(!f)return;
  if(!(S.form&&S.form.mode==='new'))openForm({mode:'new',payer:S.me||'a',amount:'',date:todayStr(),time:'',store:'',category:CATS[0],memo:''});
  runScan(f);
});

/* ---------- start ---------- */
function afterData(){
  S.ready=S.gotS&&S.gotE;
  if(S.ready){clearTimeout(S.timer);S.slow=false}
  renderMain();refreshSheet();maybeOnboard();
}
async function startData(){
  S.me=loadMe();S.fail=null;S.ready=false;S.gotS=false;S.gotE=false;S.srvS=false;
  renderMain();
  clearTimeout(S.timer);
  S.timer=setTimeout(()=>{if(!S.ready){S.slow=true;renderMain()}},10000);
  try{
    const [app,fsm]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-firestore.js')]);
    const a=app.initializeApp({apiKey:S.cfg.k,authDomain:S.cfg.d,projectId:S.cfg.p,appId:S.cfg.a});
    let db;
    try{db=fsm.initializeFirestore(a,{localCache:fsm.persistentLocalCache({tabManager:fsm.persistentMultipleTabManager()})})}
    catch(e){db=fsm.getFirestore(a)}
    FS={m:fsm,db};
  }catch(e){S.fail='load';renderMain();return}
  const onErr=e=>{S.fail=e&&e.code==='permission-denied'?'perm':'data';renderMain()};
  const opt={includeMetadataChanges:true};
  FS.m.onSnapshot(R('settings','pair'),opt,snap=>{
    const d=snap.exists()?snap.data():null;
    S.names=d&&d.names&&typeof d.names.a==='string'&&typeof d.names.b==='string'?{a:d.names.a,b:d.names.b}:null;
    S.gotS=true;if(!snap.metadata.fromCache)S.srvS=true;afterData();
  },onErr);
  FS.m.onSnapshot(C('expenses'),opt,snap=>{
    S.expenses=snap.docs.map(d=>norm(d.id,d.data()||{})).filter(e=>e.amount>0);
    S.gotE=true;afterData();
  },onErr);
}
loadConn();
renderMain();
if(S.cfg){
  if(!S.room){S.room=newRoom()}
  saveConn();
  startData();
}
})();
</script>
